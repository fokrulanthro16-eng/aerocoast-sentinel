  <!-- ==================== NODE 1: OPTICAL INGESTION ==================== -->
  <g id="node1" transform="translate(30, 90)">
    <rect x="0" y="0" width="205" height="300" rx="10" fill="url(#cardGradCyan)" stroke="#0284c7" stroke-width="1.8" />
    <rect x="0" y="0" width="205" height="38" rx="10" fill="#0369a1" fill-opacity="0.25" />
    <line x1="0" y1="38" x2="205" y2="38" stroke="#0284c7" stroke-width="1" />
    <text x="14" y="24" fill="#38bdf8" font-size="12" font-weight="bold">1. OPTICAL INGESTION</text>
    
    <text x="14" y="65" fill="#f8fafc" font-size="13" font-weight="bold">Dual Sensor Stream</text>
    <text x="14" y="85" fill="#94a3b8" font-size="11">Zero External Video I/O</text>

