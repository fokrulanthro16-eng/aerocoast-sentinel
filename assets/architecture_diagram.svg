  <path d="M 235 240 L 265 240" stroke="#06b6d4" stroke-width="2.5" marker-end="url(#arrowCyan)" fill="none" />
  <text x="250" y="225" fill="#38bdf8" font-size="10" text-anchor="middle" font-weight="600">60 FPS</text>

  <!-- 2 -> 3 -->
  <path d="M 470 240 L 500 240" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrowEmerald)" fill="none" />
  <text x="485" y="225" fill="#34d399" font-size="10" text-anchor="middle" font-weight="600">INT8</text>

