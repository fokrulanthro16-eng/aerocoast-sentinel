    <text x="20" y="24" fill="#64748b" font-size="11">OPERATIONAL SPECIFICATION:</text>
    <text x="190" y="24" fill="#38bdf8" font-size="11" font-weight="bold">100% Zero-Cloud Execution</text>
    <text x="360" y="24" fill="#64748b" font-size="11">•</text>
    <text x="380" y="24" fill="#34d399" font-size="11" font-weight="bold">Sub-15ms Local SIMD</text>
    <text x="530" y="24" fill="#64748b" font-size="11">•</text>
    <text x="550" y="24" fill="#fbbf24" font-size="11" font-weight="bold">4.2W Continuous Solar Budget</text>
    <text x="750" y="24" fill="#64748b" font-size="11">•</text>
    <text x="770" y="24" fill="#c084fc" font-size="11" font-weight="bold">Texas A&amp;M IslanderHack 2026 Champion Architecture</text>
