    <text x="22" y="128" fill="#fbbf24" font-size="11" font-weight="600">● Battery Architecture</text>
    <text x="22" y="145" fill="#64748b" font-size="10">  4S LiFePO4 (13.26V Nom)</text>
    <text x="22" y="160" fill="#e2e8f0" font-size="10">  96.4% SoC / 10Ah Pack</text>

    <text x="22" y="185" fill="#fbbf24" font-size="11" font-weight="600">● Solar PV Input</text>
    <text x="22" y="202" fill="#10b981" font-size="11" font-weight="bold">  +18.7W Harvest / Day</text>

    <text x="22" y="228" fill="#fbbf24" font-size="11" font-weight="600">● Green AI Audit</text>
    <text x="22" y="245" fill="#38bdf8" font-size="11" font-weight="bold">  98.3% Carbon Avoided</text>
    <text x="22" y="262" fill="#64748b" font-size="10">  2.38 kg CO2e / Day Saved</text>
  </g>

