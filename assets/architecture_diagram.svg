    <text x="22" y="172" fill="#2dd4bf" font-size="11" font-weight="600">● TCEQ Water Quality</text>
    <text x="22" y="189" fill="#64748b" font-size="10">  Salinity (35.4 PSU Norm)</text>
    <text x="22" y="204" fill="#64748b" font-size="10">  GCOOS Nearshore Buoy</text>

    <text x="22" y="232" fill="#2dd4bf" font-size="11" font-weight="600">● Taxonomy Grounding</text>
    <text x="22" y="249" fill="#e2e8f0" font-size="10">  iNaturalist &amp; GBIF</text>
    <text x="22" y="265" fill="#34d399" font-size="10" font-weight="bold">  Protected Species Class</text>
  </g>

