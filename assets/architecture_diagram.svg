  <g id="node5" transform="translate(970, 90)">
    <rect x="0" y="0" width="200" height="300" rx="10" fill="url(#cardGradPurple)" stroke="#9333ea" stroke-width="1.8" />
    <rect x="0" y="0" width="200" height="38" rx="10" fill="#7e22ce" fill-opacity="0.25" />
