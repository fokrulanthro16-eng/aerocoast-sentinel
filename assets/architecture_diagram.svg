    <text x="22" y="145" fill="#64748b" font-size="10">  Exportable GeoJSON</text>
    <text x="22" y="160" fill="#e2e8f0" font-size="10">  Tamper-Evident SHA256</text>

    <text x="22" y="185" fill="#c084fc" font-size="11" font-weight="600">● LoRaWAN US915</text>
    <text x="22" y="202" fill="#e2e8f0" font-size="10">  903.9 MHz Band 2</text>
    <text x="22" y="217" fill="#64748b" font-size="10">  -86 dBm RSSI / 100% Tx</text>

    <text x="22" y="242" fill="#c084fc" font-size="11" font-weight="600">● Ring Buffer</text>
    <text x="22" y="259" fill="#10b981" font-size="11" font-weight="bold">  64MB SRAM Zero-Drop</text>
